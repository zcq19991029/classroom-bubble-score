<!doctype html><meta charset="utf-8"><title>加减分动画验收</title>
<link rel="stylesheet" href="/bubble-feedback.css">
<style>body{font:18px system-ui;background:#fff7fa;padding:40px;color:#403240}button{padding:12px 22px;margin:8px;border:0;border-radius:12px;background:#ed2637;color:white}.bubble-wrap{position:relative;width:108px;height:138px;margin:70px;display:flex;align-items:center;flex-direction:column}.bubble{position:relative;width:100px;height:100px;border-radius:50%;display:grid;place-items:center;border:2px solid #efacc7;background:radial-gradient(at 30% 25%,white,#edf7ff,#ffe8f0);box-shadow:inset 6px 8px 16px white}.emoji{font-size:42px}.bubble-identity{display:none;font-size:30px}#stage.scoring-unlocked .emoji{display:none}#stage.scoring-unlocked .bubble-identity{display:flex}.no{color:#e82932}.score{position:absolute;right:-4px;top:0;background:white;border-radius:50%;padding:8px;z-index:4;font-size:14px;color:#ed2637}</style>
<h1>加减分动画（无学生数据）</h1><button id="plus">模拟加分</button><button id="minus">模拟扣分</button><button id="identity">切换学号模式</button>
<div id="stage"><div class="bubble-wrap"><div class="bubble"><span class="emoji">🐱</span><span class="bubble-identity">明<span class="no">08</span></span><span class="score">0</span></div><span>08 测试学生</span></div></div>
<script src="/bubble-feedback.js"></script><script>const wrap=document.querySelector('.bubble-wrap');document.querySelector('#plus').onclick=()=>BubbleFeedback.play(wrap,1);document.querySelector('#minus').onclick=()=>BubbleFeedback.play(wrap,-1);document.querySelector('#identity').onclick=()=>document.querySelector('#stage').classList.toggle('scoring-unlocked');</script>
